name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (preinstalado en ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Generar APK debug y release
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      # Si algo falla, guardamos los reportes y logs para poder diagnosticarlos y corregir el código.
      - name: Publicar logs y reportes de error (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-y-reportes
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar en Releases (enlace directo de descarga)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión (${{ github.sha }})
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
